name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read by default. GitHub Actions has no step-level permission, so
# `contents: write` lives on the job that creates the draft release.
permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Produces the NSIS installer plus the standalone binary.
      - name: Build
        run: npm run app:build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/aula-win68-center.exe
          draft: true
          generate_release_notes: true
          body: |
            ## Installing

            Run the `.exe` installer. Windows x64, installs for the current user,
            no administrator rights required.

            If you prefer a portable binary, grab `aula-win68-center.exe` from the
            assets and run it directly — it needs no runtime installed.

            ## Before you report a problem

            `aula-probe state` shows exactly what the keyboard reports about
            itself, and is the fastest way to diagnose anything that looks wrong:

            ```
            cargo run --manifest-path tools/probe/Cargo.toml --release -- state
            ```

            ## Reminders

            * The app writes to real hardware. Snapshots are restored, but if you
              have a specific configuration you care about, note it before
              experimenting.
            * Some features do not exist in firmware 9.1 — see
              [RESEARCH-NOTES](https://github.com/igor-2012-killer/aula-win68-center/blob/main/docs/RESEARCH-NOTES.md).
