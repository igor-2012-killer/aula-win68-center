name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

  backend:
    name: Backend (test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri's build script links against webkit2gtk and glib, and hidapi's
      # needs libudev. Without these, `glib-sys` and `hidapi` both fail in their
      # build scripts rather than in the code.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Unit tests
        # No hardware in CI: the hardware suite is #[ignore]d and excluded here.
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Format check
        # No `--all`: the crate is not a workspace root, and cargo now warns on it.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  probe:
    name: Protocol tool builds standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The probe shares hid.rs with the app, so it needs the same libudev.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/probe -> target

      # The probe includes protocol.rs / hid.rs / keymap.rs by source path, so
      # it catches those modules drifting away from the app.
      - run: cargo build --manifest-path tools/probe/Cargo.toml --release

  windows:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Required, not optional: `tauri::generate_context!()` resolves
      # `frontendDist` ("../dist") at compile time and panics if it is missing,
      # which is why this job failed while the Linux ones passed.
      - name: Build frontend
        run: npm run build

      - name: Build release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features custom-protocol

      - uses: actions/upload-artifact@v4
        with:
          name: aula-win68-center
          path: src-tauri/target/release/aula-win68-center.exe
          if-no-files-found: error

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches broken relative links between README / docs / templates, which
      # is the most common way this repo rots.
      #
      # The inner loop is fed by process substitution rather than a pipe. Both
      # forms were run locally against a deliberately broken link and both exited
      # non-zero, so this is tidiness rather than a bug fix: bash may run the
      # last stage of a pipeline in the current shell, and relying on that is not
      # worth the subtlety. Rehearsed locally, including the failure case.
      #
      # The `actions/configure-pages` step that used to sit above this one was
      # the actual cause of this job failing: it requires Pages to be enabled on
      # the repository, and it is not. It had no bearing on link checking.
      - name: Check relative markdown links
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            while IFS= read -r link; do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::broken link -> $link"
                fail=1
              fi
            done < <(
              grep -oE '\]\(([^)#][^)]*)\)' "$file" \
                | sed -E 's/^\]\((.*)\)$/\1/' \
                | grep -vE '^(https?:|mailto:|#)' || true
            )
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*')
          if [ "$fail" -ne 0 ]; then
            echo "Broken relative links found."
          fi
          exit "$fail"