[package]
name = "aula-win68-center"
version = "2.0.0"
description = "Native control panel for the Aula WIN68 HE Pro magnetic keyboard"
authors = ["Antigravity"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aula_win68_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build` turns this on. Without it Tauri serves `devUrl`, so a plain
# `cargo build --release` produces a binary that waits on the Vite dev server.
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
hidapi = "2.6"
ts-rs = "10.1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
heck = "0.5.0"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full", "visit"] }

# `priority = -1` lets a more specific lint, or an `#[allow]` in source, override
# the group. Keep this table aligned with tools/probe/Cargo.toml for every lint
# that applies to protocol.rs, hid.rs, and keymap.rs (the probe includes them
# by path). The three entries below the shared set are app-only: the probe is
# a CLI and prints, including `process::exit`.
[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
